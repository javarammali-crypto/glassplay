name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Releases are numbered v1, v2, …: one more than the latest release.
      - name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,name -q '.tagName + " " + .name' 2>/dev/null || true)
          number=$(echo "$latest" | grep -oiE '(^|[^a-z0-9])v[0-9]+' | head -1 | tr -dc '0-9')
          echo "APP_VERSION=$(( ${number:-0} + 1 ))" >> "$GITHUB_ENV"
          echo "Latest release: '$latest' -> building v$(( ${number:-0} + 1 ))"

      # The release key lives only in the repository's secrets.
      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GlassPlay-v${APP_VERSION}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlay-apk
          path: GlassPlay-v${{ env.APP_VERSION }}.apk

      # The app checks the latest release and offers it as an update; the notes below are
      # shown in its update pop-up.
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: GlassPlay v${{ env.APP_VERSION }}
          body: ${{ github.event.head_commit.message }}
          files: GlassPlay-v${{ env.APP_VERSION }}.apk
