name: Check

# Compiles pull requests so problems show up before they're merged. Unlike the release
# build, this needs no signing key and publishes nothing.
on:
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile
        run: gradle compileReleaseKotlin --no-daemon
