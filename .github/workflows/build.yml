name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Releases are numbered v1, v2, …; build run 7 was released as v1.
  VERSION_OFFSET: 6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Work out the version
        run: echo "APP_VERSION=$(( ${{ github.run_number }} - VERSION_OFFSET ))" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GlassPlay-v${APP_VERSION}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlay-apk
          path: GlassPlay-v${{ env.APP_VERSION }}.apk

      # The app checks the latest release and offers it as an update; the notes below are
      # shown in its update pop-up.
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: GlassPlay v${{ env.APP_VERSION }}
          body: ${{ github.event.head_commit.message }}
          files: GlassPlay-v${{ env.APP_VERSION }}.apk
